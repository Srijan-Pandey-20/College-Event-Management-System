databases:
  - name: srmcem-event-db
    plan: free
    databaseName: srmcem_events
    user: srmcem_events

services:
  - type: web
    name: srmcem-event-portal
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn socialbook.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: srmcem-event-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
