<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SignUp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">SRMCEM <span style="color: rgb(248, 7, 7)"> PORTAL</span></a>
        </div>
      </nav>
    </header>

    <h2 style="color: red; text-align: center">Signup</h2>

    <!-- Form -->
 <form id="signupForm" class="container" style="width: 600px">
  <div class="mb-3">
    <label for="username" class="form-label">User Name</label>
    <input type="text" class="form-control" id="username" />
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email address</label>
    <input type="email" class="form-control" id="email" required />
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password" required />
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>

<!-- ✅ Green login button outside the form -->
<div class="container mt-2" style="width: 600px">
  <a href="/accounts/login" class="btn btn-success">
    Login if Already Have an Account
  </a>
</div>


    <script>
      document.getElementById("signupForm").addEventListener("submit", async function (e) {
        e.preventDefault(); // stop normal form submit

        let data = {
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        try {
          let response = await fetch("/accounts/register/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(data),
          });

          let result = await response.json();
          if (result.status) {
            alert("✅ " + result.message);
            window.location.href = "/accounts/login"; // redirect after signup (optional)
          } else {
            alert("❌ " + result.error);
          }
        } catch (err) {
          alert("⚠️ Something went wrong: " + err);
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
